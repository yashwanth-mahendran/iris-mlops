apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: iris-classifier
  namespace: default
spec:
  predictor:
    containers:
    - name: kserve-container
      image: localhost/iris-mlops:latest
      imagePullPolicy: Never  # Use local image, don't pull from registry
      ports:
      - containerPort: 8000
        protocol: TCP
      env:
      - name: STORAGE_URI
        value: "pvc://model-store"
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi