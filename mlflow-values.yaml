# values.yaml for MLflow Helm (community-charts/mlflow)

replicaCount: 1

image:
  repository: burakince/mlflow
  tag: latest
  pullPolicy: IfNotPresent

# -------------------
# Backend Store (DB)
# -------------------
backendStore:
  # Enable automatic database migrations
  databaseMigration: true

  # Use SQLite for lightweight local persistence
  sqlite:
    enabled: true

  # (Optional) PostgreSQL setup (recommended for production)
  postgres:
    enabled: false
    host: ""
    port: ""
    database: ""
    user: ""
    password: ""

# -------------------------
# Artifact Storage Config
# -------------------------
artifactRoot:
  # Local file system root for artifacts
  local:
    enabled: true
    path: /mlflow/artifacts

  # AWS S3 example (disable if using local)
  s3:
    enabled: false
    bucket: ""
    path: ""
    region: ""
    awsAccessKeyId: ""
    awsSecretAccessKey: ""

# ----------------------------
# Persistence / Volumes
# ----------------------------
persistence:
  enabled: true
  # Combined PVC for DB + artifacts
  accessMode: ReadWriteOnce
  size: 5Gi

# -------------------
# Service Exposure
# -------------------
service:
  type: NodePort
  port: 5000

# -------------------
# Logging & Probes
# -------------------
log:
  enabled: true
  level: info

# Health checks
livenessProbe:
  httpGet:
    path: /
    port: 5000

readinessProbe:
  httpGet:
    path: /
    port: 5000

# -------------------
# Extra Env Vars
# e.g., S3 endpoint for MinIO
# -------------------
extraEnvVars: []

# -------------------
# Optional Authentication
# -------------------
auth:
  enabled: false
  adminUsername: admin
  adminPassword: password
